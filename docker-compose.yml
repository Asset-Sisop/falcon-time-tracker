services:
  db:
    image: postgres:16-alpine
    container_name: falcon-time-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: falcon_time_tracker
      POSTGRES_USER: falcon_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - falcon_time_tracker_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon_app -d falcon_time_tracker"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [falcon-internal]
  app:
    build: .
    container_name: falcon-time-tracker-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://falcon_app:${POSTGRES_PASSWORD}@db:5432/falcon_time_tracker
    ports:
      - "${APP_PORT:-8088}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [falcon-internal]
networks:
  falcon-internal:
    driver: bridge
volumes:
  falcon_time_tracker_data:
